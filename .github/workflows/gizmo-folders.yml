name: Build Gizmo Folders
on:
  workflow_dispatch:
  push:
    paths: ['GizmoFolders/**', '.github/workflows/gizmo-folders.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build GizmoFolders/Source/GizmoFolders.csproj -c Release
      - run: |
          mkdir -p dist/GizmoFolders
          cp -r GizmoFolders/{About,Languages,1.7} dist/GizmoFolders/
          find dist/GizmoFolders/1.7/Assemblies -type f ! -name GizmoFolders.dll -delete
          test -s dist/GizmoFolders/1.7/Assemblies/GizmoFolders.dll
          cd dist
          zip -r ../GizmoFolders_0.1.0_RimWorld_1.7.zip GizmoFolders
      - uses: actions/upload-artifact@v4
        with:
          name: GizmoFolders-RimWorld-1.7
          path: dist/
          if-no-files-found: error
