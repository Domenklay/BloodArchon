name: Build Gizmo Folders
on:
  workflow_dispatch:
  push:
    paths: ['GizmoFolders/**', '.github/workflows/gizmo-folders.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build GizmoFolders/Source/GizmoFolders.csproj -c Release
      - run: |
          test -s GizmoFolders/1.7/Assemblies/GizmoFolders.dll
          mkdir -p dist/GizmoFolders/1.7/Assemblies
          cp -r GizmoFolders/About GizmoFolders/Languages dist/GizmoFolders/
          cp GizmoFolders/LoadFolders.xml dist/GizmoFolders/
          cp GizmoFolders/1.7/Assemblies/GizmoFolders.dll dist/GizmoFolders/1.7/Assemblies/
      - uses: actions/upload-artifact@v4
        with:
          name: GizmoFolders-RimWorld-1.7
          path: dist/
          if-no-files-found: error
