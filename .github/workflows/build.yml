name: Build Blood Archon
on:
  workflow_dispatch:
  push:
    paths: ['BloodArchon/**', '.github/workflows/build.yml', 'tools/**']
permissions:
  contents: read
concurrency:
  group: bloodarchon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch public mod dependencies
        run: |
          mkdir -p build-refs
          curl --fail --retry 3 -L https://raw.githubusercontent.com/Vanilla-Expanded/VanillaExpandedFramework/main/1.7/Assemblies/VEF.dll -o build-refs/VEF.dll
          curl --fail --retry 3 -L https://raw.githubusercontent.com/Vanilla-Expanded/VanillaPsycastsExpanded/main/1.7/Assemblies/VanillaPsycastsExpanded.dll -o build-refs/VanillaPsycastsExpanded.dll
      - name: Compile mod DLL
        run: |
          dotnet build BloodArchon/Source/BloodArchon.csproj -c Release "-p:VefDll=$PWD/build-refs/VEF.dll" "-p:VpeDll=$PWD/build-refs/VanillaPsycastsExpanded.dll"
          test -s BloodArchon/1.7/Assemblies/BloodArchon.dll
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BloodArchon-DLL
          path: BloodArchon/1.7/Assemblies/BloodArchon.dll
          if-no-files-found: error
      - name: Prepare mod
        run: |
          mkdir -p dist/BloodArchon
          cp -r BloodArchon/{About,Languages,LoadFolders.xml,1.7} dist/BloodArchon/
          if [ -d BloodArchon/Textures ]; then cp -r BloodArchon/Textures dist/BloodArchon/; fi
          find dist/BloodArchon/1.7/Assemblies -type f ! -name BloodArchon.dll -delete
      - uses: actions/upload-artifact@v4
        with:
          name: BloodArchon-RimWorld-1.7
          path: dist/
          if-no-files-found: error
